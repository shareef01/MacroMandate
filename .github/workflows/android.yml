name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit Tests, Lint & Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run Android Lint (Debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (Minified / R8 verification)
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release App Bundle (unsigned validation)
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify Release Key Guard
        run: |
          echo "HUGGINGFACE_API_KEY=test_accidental_token" > local.properties
          set +e
          ./gradlew verifyReleaseConfiguration --no-configuration-cache --rerun-tasks > guard.log 2>&1
          status=$?
          set -e
          rm -f local.properties
          cat guard.log
          if [ "$status" -eq 0 ]; then
            echo "Guard unexpectedly accepted an embedded key"
            exit 1
          fi
          grep -q "MM_RELEASE_EMBEDDED_API_KEY_FORBIDDEN" guard.log || {
            echo "Gradle failed for an unrelated reason; guard did not pass"
            exit 1
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  instrumented-tests:
    name: Instrumented Room & UI Tests (API 34)
    runs-on: macos-14
    timeout-minutes: 35
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
